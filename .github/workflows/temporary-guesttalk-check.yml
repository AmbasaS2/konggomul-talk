name: Guest Talk mode cleanup checks
on:
  push:
    branches:
      - feature/guesttalk-simplified-modes-20261113
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: JavaScript syntax
        run: node --check index.js
      - name: Mode, storage and translation regression checks
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const js=fs.readFileSync('index.js','utf8');
          const modes=js.slice(js.indexOf('const MODES = {'),js.indexOf('\nconst THEMES = {'));
          const names=[...modes.matchAll(/^  ([A-Za-z0-9]+): \\{/gm)].map(m=>m[1]);
          assert.deepEqual(names,['kongtalk','guestOoc','rpAssistant','parallelClassic','parallel']);
          assert(js.includes("const GUEST_ROOM_STORE_KEY = '__konggomul_guest_ooc__';"));
          assert(js.includes("const MODULE_NAME = 'title_undecided_assistant';"));
          assert(js.includes("mode: storedMode"));
          assert(js.includes("mode: RETIRED_MODE_KEYS.has(room.mode) ? room.mode : migrateModeKey(room.mode)"));
          assert(js.includes("if (mode === 'care' || RETIRED_MODE_KEYS.has(mode)) return 'kongtalk';"));
          assert(js.includes("return room ? migrateModeKey(room.mode) : 'kongtalk';"));
          assert(js.includes("getLorebookBlock(currentUserText)"));
          assert(js.includes("the same person as the active RP persona"));
          assert(js.includes("function getRoomDisplayTitle(room)"));
          assert(!js.includes("id=\"tua-panel-coworker-note\""));
          assert(!js.includes("function buildCoworkerIntroInstruction"));
          assert(!js.includes("function getCoworkerWorkNoteBlock"));
          assert(!js.includes("summarizeRecentKongtalkToMain"));
          const marker='const UI_ENGLISH = Object.freeze(';
          const a=js.indexOf(marker),b=js.indexOf(');\nfunction uiText',a);
          assert(a>=0 && b>a);
          const en=JSON.parse(js.slice(a+marker.length,b));
          assert.equal(en['mode.guestOoc'],'Guest Talk');
          const removed=['mode.butler','mode.pet','mode.coworker','panel.coworkerNote','panel.coworkerNoteHint'];
          for(const key of removed)assert(!Object.hasOwn(en,key));
          const locales=['ko-kr','ja-jp','zh-cn','zh-tw','es-es'];
          for(const locale of locales){
            const data=JSON.parse(fs.readFileSync('i18n/'+locale+'.json','utf8'));
            const expected=Object.keys(en).map(k=>'konggomul.'+k);
            assert.equal(Object.keys(data).length,expected.length);
            for(const key of expected){
              assert.equal(typeof data[key],'string',locale+' missing '+key);
              assert(data[key].length>0);
              const markers=(text)=>[...text.matchAll(/\\{\\d+\\}/g)].map(x=>x[0]).sort().join(',');
              assert.equal(markers(data[key]),markers(en[key.slice(10)]),locale+' placeholder mismatch '+key);
            }
            for(const key of removed)assert(!Object.hasOwn(data,'konggomul.'+key));
            assert(!/OOC/i.test(data['konggomul.mode.guestOoc']));
          }
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          assert.equal(manifest.version,'5.2.1');
          assert.equal(Object.keys(manifest.i18n||{}).length,5);
          console.log('Modes, saved room compatibility and 144 locale keys validated');
          NODE
      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD
