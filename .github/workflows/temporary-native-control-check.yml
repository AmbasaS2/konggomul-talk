name: Native settings control checks
on:
  push:
    branches:
      - fix/native-settings-controls-20261113
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: JavaScript syntax
        run: node --check index.js
      - name: Verify native SillyTavern styling is not overridden
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const js = fs.readFileSync('index.js', 'utf8');
          const css = fs.readFileSync('style.css', 'utf8');
          assert(js.includes('<select id="tua-setting-profile" class="text_pole"></select>'));
          assert(js.includes('class="menu_button tua-debug-settings-button"'));
          assert(js.includes('id="tua-copy-debug" class="menu_button"'));
          assert(js.includes('id="tua-clear-debug" class="menu_button"'));
          assert(!css.includes('#tua-settings #tua-setting-profile.text_pole {'));
          assert(!css.includes('#tua-setting-profile-select-wrap'));
          const start = css.indexOf("/* v4.1.3: debug dump button lives");
          const end = css.indexOf("/* v4.3.0: polished popup corners", start);
          assert(start > -1 && end > start);
          const related = css.slice(start, end);
          for (const forbidden of ['border-radius: 0 !important', 'max-width: 124px !important',
            'min-height: 28px !important', 'font-size: 11.5px !important']) {
            assert(!related.includes(forbidden), 'Native button override remains: ' + forbidden);
          }
          assert(css.includes('#tua-settings #tua-setting-profile {'));
          assert(css.includes('max-width: min(100%, 320px) !important'));
          assert(css.includes('max-width: 100%;'));
          console.log('Native controls and responsive layout verified');
          NODE
      - name: Patch whitespace check
        run: git diff --check HEAD~1 HEAD
