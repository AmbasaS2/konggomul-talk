name: Konggomul Talk quality update checks
on:
  push:
    branches:
      - feature/persona-preview-auto-quote-20261113
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: JavaScript syntax
        run: node --check index.js
      - name: Data, locale and feature regression tests
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('index.js', 'utf8');
          const code = (from, to) => {
            const a = source.indexOf(from);
            const b = source.indexOf(to, a + from.length);
            assert(a >= 0 && b > a, 'missing boundary ' + from + ' -> ' + to);
            return source.slice(a,b);
          };

          // UI translations, including new dynamic labels and interpolation parameters.
          const dict = JSON.parse(code('const UI_ENGLISH = Object.freeze(', ');\nfunction uiText').slice('const UI_ENGLISH = Object.freeze('.length));
          const locales = ['ko-kr','ja-jp','zh-cn','zh-tw','es-es'];
          for (const locale of locales) {
            const translated = JSON.parse(fs.readFileSync('i18n/' + locale + '.json','utf8'));
            assert.equal(Object.keys(translated).length, Object.keys(dict).length);
            for (const [key, value] of Object.entries(dict)) {
              const localized = translated['konggomul.' + key];
              assert.equal(typeof localized, 'string', locale+' missing '+key);
              assert(localized.length > 0);
              const placeholders = s => [...s.matchAll(/\{\d+\}/g)].map(x=>x[0]).sort().join(',');
              assert.equal(placeholders(localized), placeholders(value), locale+' invalid placeholders '+key);
            }
          }
          for (const key of ['panel.autoOutput','guest.personaChanged','guest.legacyPersonaUnknown',
            'message.reply','message.quotedFrom','preview.open','preview.note']) assert(dict[key], 'missing '+key);

          // New room metadata and quote references survive the existing saved-room normalizer.
          const normalizeCode = code('function normalizeStoredRoomState(raw) {','function getKongtalkIntroIcon() {');
          const dependencies = {
            migrateModeKey: x=>x,
            RETIRED_MODE_KEYS: new Set(),
            normalizeAssistantVariantState: (role,c)=>({content:String(c || '')}),
            normalizeQuotedReference: q=>q && q.content?{messageId:q.messageId,speaker:q.speaker,content:q.content}:null,
            normalizeGuestPersonaBinding: b=>b && b.key ? b : null,
            recomputeRoomLastMessageAt: r=>{},
            getMessageUpdatedAt: m=>m.at||0,
            getRoomStateUpdatedAt: d=>d.updatedAt||0,
            normalizeTombstoneMap: ()=>({}),
            pruneExpiredDeletionMarkers: ()=>{},
            defaultRoomTitle:()=> 'Room',
            Date, Math, Number, String, Array, Object, JSON,
          };
          vm.runInNewContext(normalizeCode+'\nthis.normalizeStoredRoomState = normalizeStoredRoomState;',dependencies);
          const original = { rooms: [{ id:'r1', title:'guest', mode:'guestOoc', createdAt:1, updatedAt:2,
            guestCharacterKey:'sirius', guestCharacterName:'Sirius',
            personaBinding:{key:'avatar:lyra|name:Lyra', name:'Lyra',rpCharacterName:'Remus',rpCharacterKey:'remus',chatId:'rp-1'},
            personaTransitions:[{fromName:'Catherine',toName:'Lyra',at:5}],
            messages:[{id:'m1',role:'user',content:'Why?',at:7,quote:{messageId:'m0',speaker:'Sirius',content:'Because.'}}]
          }]};
          const normalized = dependencies.normalizeStoredRoomState(original);
          assert.equal(normalized.rooms[0].personaBinding.key,'avatar:lyra|name:Lyra');
          assert.equal(normalized.rooms[0].personaTransitions[0].fromName,'Catherine');
          assert.equal(normalized.rooms[0].messages[0].quote.content,'Because.');
          assert.equal(normalized.rooms[0].guestCharacterKey,'sirius');

          // New user persona data changes room identity and quoted history retains its reference.
          const context = {name1:'Lyra',user_avatar:'lyra.png'};
          const personaCode = code('function getCurrentGuestPersonaBinding() {','function getGuestPersonaHistoryNote(');
          const p = {ctx:()=>context,getCharKey:()=> 'remus',getCharName:()=> 'Remus',String,Object};
          vm.runInNewContext(personaCode+'\nthis.bind = getCurrentGuestPersonaBinding;',p);
          const lyra = p.bind().key;
          context.name1='Catherine';context.user_avatar='catherine.png';
          assert.notEqual(p.bind().key,lyra);

          const replyCode = code('function normalizeQuotedReference(value) {','function getCurrentUserQuote(');
          const guestRoom = {
            mode:'guestOoc',personaBinding:{name:'Lyra'},
            personaTransitions:[{fromName:'Catherine',toName:'Lyra',at:10}],
          };
          const q = {getActiveRoom:()=> guestRoom,getRoomMode:()=> 'guestOoc'};
          vm.runInNewContext(replyCode+'\nthis.format = formatRoomMessageForPrompt;',q);
          const earlier = q.format({role:'user',content:'What?',at:5,quote:{messageId:'m0',speaker:'Sirius',content:'Hello!'}});
          assert(earlier.includes('earlier Guest Talk conversation') || earlier.includes('Earlier Guest Talk conversation'));
          assert(earlier.includes('Hello!'));
          assert(earlier.includes('Catherine'));
          const current = q.format({role:'user',content:'Now?',at:12});
          assert(!current.includes('Catherine'));

          // Default answer language stays Korean; only opted-in Auto follows the ST locale.
          assert(source.includes("outputLanguage: 'ko'"));
          assert(source.includes("new Set(['auto', 'ko', 'en', 'bilingual'])"));
          const autoCode = code('const UI_LOCALE_LANGUAGE_NAMES = Object.freeze(', 'function buildOutputLanguageInstruction(');
          let chosen = 'ja-jp';
          const lang = {ctx:()=>({getCurrentLocale:()=>chosen}),getSettings:()=>({outputLanguage:'auto'})};
          vm.runInNewContext(autoCode+'\nthis.autoName = getAutoOutputLanguageName;this.effective = getEffectiveOutputLanguage;',lang);
          assert.equal(lang.autoName(),'Japanese');
          chosen='zh-tw';assert.equal(lang.autoName(),'Traditional Chinese');
          chosen='ko-kr';assert.equal(lang.effective(),'ko');
          chosen='en-US';assert.equal(lang.effective(),'en');
          assert(source.includes('function showLastRequestPreview()'));
          assert(source.includes("let lastRequestPreview = null"));
          assert(source.includes("room.personaTransitions.push"));
          assert(source.includes("POPUP_RESULT.NEGATIVE"));
          assert(source.includes("await createGuestOocRoom(room.guestCharacterKey)"));
          assert(source.includes("function beginQuotedReply(messageId)"));
          assert(source.includes("function getCurrentUserQuote(userText"));
          assert(source.includes("id=\"tua-preview-context\""));
          assert(source.includes("id=\"tua-reply-preview\""));
          assert(!source.includes("function getRelevantOldRpMessages"));
          console.log('PASS: '+Object.keys(dict).length+' localization keys, room persistence, quote history, persona identity and locale output');
          NODE
      - name: Whitespace validation
        run: git diff --check HEAD~1 HEAD
